<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sains Tanah</title>
  <meta name="description" content="Panduan lapangan sains tanah dalam Bahasa Melayu, English dan 中文.">
  <meta name="theme-color" content="#edf1ec" id="themecolor">
  <meta name="color-scheme" content="light dark">
  <script>try { if (localStorage.getItem('soil.theme') === '"dark"') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="bar">
    <a class="brand" href="#/" id="brand"></a>
    <nav class="tabs" id="tabs" aria-label="Main"></nav>
    <div class="bar-end">
      <button type="button" class="themebtn" id="theme"></button>
      <div class="lang" id="lang" role="group"></div>
    </div>
  </header>
  <p class="storewarn" id="storewarn" role="alert" hidden></p>
  <main id="main" tabindex="-1"></main>
  <footer class="foot" id="foot"></footer>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toastmsg"></span>
    <button type="button" id="toastgo"></button>
    <button type="button" id="toastx">✕</button>
  </div>
  <div id="langpick" role="dialog" aria-modal="true" tabindex="-1" aria-label="English · 中文 · Bahasa Melayu" hidden>
    <img src="icons/icon-192.png" alt="" width="96" height="96">
    <p class="lptitle">Soil Science<br><span lang="zh-Hans">土壤科学</span><br>Sains Tanah</p>
    <button type="button" data-langpick="en" lang="en">English</button>
    <button type="button" data-langpick="zh" lang="zh-Hans">中文</button>
    <button type="button" data-langpick="ms" lang="ms">Bahasa Melayu</button>
  </div>
  <script src="js/content.js"></script>
  <script src="js/units.js"></script>
  <script src="js/crops.js"></script>
  <script src="js/records.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
